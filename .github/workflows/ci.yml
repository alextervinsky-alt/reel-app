name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-tests:
    runs-on: ubuntu-24.04
    container: swift:6.0-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Run ReelCore tests (offline)
        run: |
          set +e
          swift build --build-tests 2>&1 | grep -E "error:|warning:" | grep -v "Tests/" | sort -u | head -60
          REEL_EXPLAIN=1 REEL_EXPLAIN_FILE=$PWD/Tests/ReelCoreTests/Fixtures/explain.txt swift test --skip-build --filter ClaimExplainTests 2>&1 | grep "^EXPLAIN|"
          swift test --skip-build --skip LiveTMDBTests --skip LiveCraftSourcesTests --skip LiveShotOnTests --skip LiveDiagnosisTests --skip ClaimExplainTests 2>&1 | tee test.log > /dev/null
          code=${PIPESTATUS[0]}
          grep -E "error:" test.log | head -80
          grep -E 'Executed [0-9]+ tests' test.log | tail -1
          grep -E "^BENCH\| " test.log
          exit $code
