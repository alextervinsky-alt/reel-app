name: CI

on:
  push:
    branches: [main, release-1.11]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-24.04
    container: swift:6.0-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Build cache
        uses: actions/cache@v4
        with:
          path: .build
          key: linux-swift6.0-${{ hashFiles('Package.swift') }}-${{ github.sha }}
          restore-keys: linux-swift6.0-${{ hashFiles('Package.swift') }}-
      - name: Run ReelCore tests (offline)
        run: |
          set +e
          swift test --skip LiveTMDBTests --skip LiveAcclaimTests 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            grep -E "error:|failed|XCTAssert" test.log | head -25 | while read -r l; do echo "::error::${l}"; done
          else
            echo "::notice::$(grep -E 'Executed [0-9]+ tests' test.log | tail -1)"
          fi
          # Measurements on synthetic libraries (UserDataTests, LibraryFormatTests).
          grep -E "^(DRYRUN|GATE)\| " test.log | sed -E 's/\| / /' | while read -r l; do echo "::notice::${l}"; done
          exit $code

  live-match:
    runs-on: ubuntu-24.04
    # Live sites and OMDb's daily quota (shared with the app): main and [build] commits only.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')
    container: swift:6.0-noble
    env:
      TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
      OMDB_KEY: ${{ secrets.OMDB_KEY }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Match the sample films against TMDB (token is never printed)
        run: |
          set +e
          swift test --filter LiveTMDBTests 2>&1 | tee live.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            grep -E "error:|failed" live.log | head -25 | while read -r l; do echo "::error::${l}"; done
          fi
          exit $code
      - name: The most acclaimed of last year, worked out live (a report)
        # Run even when an earlier live step failed (an OMDb key over its daily limit).
        if: ${{ !cancelled() }}
        run: |
          set +e
          # OMDb's 1,000 requests a day are shared with the app: 50 look-ups only on a pushed [build] commit
          # (a manual run has no commit message here, so it looks up none).
          OMDB_ACCLAIM_LOOKUPS=${{ contains(github.event.head_commit.message, '[build]') && '50' || '0' }} \
            swift test --skip-build --filter LiveAcclaimTests > acclaim.log 2>&1
          grep -E "^::notice::Most acclaimed" acclaim.log || echo "::notice::Most acclaimed: not worked out ($(grep -cE 'error|failed' acclaim.log) errors)"
          exit 0

  secrets-check:
    runs-on: ubuntu-24.04
    env:
      TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
      OMDB_KEY: ${{ secrets.OMDB_KEY }}
    steps:
      - name: Check API secrets (values are never printed)
        run: |
          fail=0
          if [ -z "$TMDB_TOKEN" ]; then
            echo "::error::TMDB_TOKEN secret is missing"; fail=1
          else
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TMDB_TOKEN" https://api.themoviedb.org/3/configuration)
            if [ "$code" = "200" ]; then echo "::notice::TMDB_TOKEN works"; else echo "::error::TMDB_TOKEN rejected (HTTP $code)"; fail=1; fi
          fi
          if [ -z "$OMDB_KEY" ]; then
            echo "::error::OMDB_KEY secret is missing"; fail=1
          else
            body=$(curl -s "https://www.omdbapi.com/?apikey=$OMDB_KEY&i=tt3896198")
            if echo "$body" | grep -q '"Response":"True"'; then echo "::notice::OMDB_KEY works"; else echo "::error::OMDB_KEY rejected"; fail=1; fi
          fi
          exit $fail

  mac-measure:
    # 1.11 work in progress: the app must build, and the smoothness gates are measured (spec §9.3):
    # no signing, no app to download, no screens published.
    runs-on: macos-15
    if: github.ref != 'refs/heads/main' && github.event_name == 'push' && !contains(github.event.head_commit.message, '[build]')
    steps:
      - uses: actions/checkout@v5
      - name: Build cache
        uses: actions/cache@v4
        with:
          path: .build
          key: macos15-release-${{ hashFiles('Package.swift') }}-${{ github.sha }}
          restore-keys: macos15-release-${{ hashFiles('Package.swift') }}-
      - name: Build the app (release)
        run: |
          start=$(date +%s)
          swift build -c release --arch arm64 > build.log 2>&1; code=$?
          grep -E "error:" build.log | sort -u | head -40 | while read -r l; do echo "::error::$l"; done
          echo "::notice::Release build took $(( $(date +%s) - start )) s, $(grep -c 'warning:' build.log) warnings"
          exit $code
      - name: Measure the gates with the sample library
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          mkdir -p screens app/Reel.app/Contents/MacOS
          cp "$(swift build -c release --arch arm64 --show-bin-path)/Reel" app/Reel.app/Contents/MacOS/Reel
          printf '<?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>CFBundleIdentifier</key><string>com.howbizzar.reel.gates</string><key>CFBundleExecutable</key><string>Reel</string><key>CFBundlePackageType</key><string>APPL</string><key>CFBundleShortVersionString</key><string>1.11-gates</string></dict></plist>' > app/Reel.app/Contents/Info.plist
          codesign --force --deep -s - app/Reel.app >/dev/null 2>&1 || true
          REEL_RENDER_SCREENS="$PWD/screens" perl -e 'alarm 1500; exec @ARGV' "$PWD/app/Reel.app/Contents/MacOS/Reel" || true
          # GitHub keeps only ten notices a step: the gates come in a few joined lines.
          grep -E "GATE " screens/progress.txt | sed -E 's/^.*(GATE .*)$/\1/' > gates.txt || true
          grep "GATE FAIL" gates.txt | paste -sd '~' - | sed 's/~/ ¦ /g' | while read -r l; do [ -n "$l" ] && echo "::warning::$l"; done
          grep -v "GATE FAIL" gates.txt | split -l 5 - gate-part-
          for f in gate-part-*; do [ -f "$f" ] && echo "::notice::$(paste -sd '~' "$f" | sed 's/~/ ¦ /g')"; done
          grep -E "scroll .*pt\): first" screens/progress.txt | sed -E 's/^.*scroll /scroll /' | split -l 3 - scroll-part- || true
          for f in scroll-part-*; do [ -f "$f" ] && echo "::notice::$(paste -sd '~' "$f" | sed 's/~/ ¦ /g')"; done
          grep -cE "GATE " screens/progress.txt >/dev/null || echo "::warning::No gates were measured: $(tail -3 screens/progress.txt 2>/dev/null)"

  mac-build:
    runs-on: macos-15
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')
    env:
      SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
      SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      - name: Build Reel.app
        run: |
          set -o pipefail
          chmod +x scripts/make-app.sh
          ./scripts/make-app.sh 2>&1 | tee build.log || {
            grep -E "error:" build.log | head -25 | while read -r l; do echo "::error::${l}"; done
            exit 1
          }
          count=$({ grep -E "/Sources/.*: warning:" build.log || true; } | sed -E 's#^.*/(Sources/[^:]+:[0-9]+):[0-9]+: #\1 #' | sort -u | tee warnings.txt | wc -l | tr -d ' ')
          echo "::notice::Compiler warnings: ${count}"
          head -10 warnings.txt | while read -r l; do echo "::warning::${l}"; done
      - uses: actions/upload-artifact@v6
        with:
          name: Reel-mac
          path: build/Reel.zip
          retention-days: 14
      - name: Render Cinema mode screens (laptop, 1080p, 4K)
        continue-on-error: true
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
        run: |
          mkdir -p screens
          # The same app with its symbols (the one shipped is stripped), so the samples name Reel's own code.
          cp -R build/Reel.app "$RUNNER_TEMP/Reel.app"
          cp "$(swift build -c release --arch arm64 --show-bin-path)/Reel" "$RUNNER_TEMP/Reel.app/Contents/MacOS/Reel"
          codesign --force --deep -s - "$RUNNER_TEMP/Reel.app" >/dev/null 2>&1 || true
          REEL_RENDER_SCREENS="$PWD/screens" perl -e 'alarm 600; exec @ARGV' "$RUNNER_TEMP/Reel.app/Contents/MacOS/Reel" &
          pid=$!
          # Where the main thread's time goes while each page scrolls: a sample of the process per page.
          (
            for page in "Film page" "Explore" "Lists" "All Films"; do
              until grep -q "scroll begins: ${page}" screens/progress.txt 2>/dev/null; do kill -0 $pid 2>/dev/null || exit 0; sleep 0.3; done
              sudo sample $pid 6 -mayDie -file "screens/sample-${page// /-}.txt" >/dev/null 2>&1 || true
            done
          ) &
          wait $pid || true
          ls -la screens
          echo "::notice::Rendered $(ls screens/*.png 2>/dev/null | wc -l | tr -d ' ') screens"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Reel-screens
          path: screens/
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish screens to the screens branch (for review without downloading)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$(ls screens 2>/dev/null)" ] || exit 0
          cd screens
          git init -q -b screens
          git config user.name "Reel CI"
          git config user.email "ci@users.noreply.github.com"
          git add . && git commit -qm "Screens for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screens
