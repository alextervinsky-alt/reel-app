name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-match:
    runs-on: ubuntu-24.04
    container: swift:6.0-noble
    env:
      TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: PROBE World War Z (not for release)
        run: |
          set +e
          swift build --build-tests 2>&1 | tail -3
          SHOTON_FILM=0 swift test --skip-build --filter LiveShotOnTests > one.log 2>&1
          grep -E "^PROBE\| " one.log | sed -E 's/^PROBE\| //' > probe.txt
          wc -l probe.txt
          # Ten notices of about 3,500 characters each.
          python3 - <<'PY' 2>/dev/null || awk '{print "::notice::" $0}' probe.txt | head -10
          lines=open("probe.txt").read().splitlines()
          chunks=[];cur=""
          for l in lines:
              if len(cur)+len(l)+3>3500: chunks.append(cur);cur=""
              cur+=(" ¦ " if cur else "")+l
          if cur: chunks.append(cur)
          for c in chunks[:10]: print("::notice::"+c.replace("%","%25"))
          PY
          exit 0
