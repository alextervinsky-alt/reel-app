name: CI

# Scratch branch review-1.11 (code review 1.11, throwaway): measurement only. No live tests, no
# signing, no app artifact, nothing published to the screens branch.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-24.04
    container: swift:6.0-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Build tests (timed)
        run: |
          start=$(date +%s)
          swift build --build-tests 2>&1 | tail -3
          echo "::notice::REVIEW build-tests took $(( $(date +%s) - start )) s"
      - name: Run ReelCore tests (offline, timed)
        run: |
          set +e
          start=$(date +%s)
          swift test --skip-build --skip LiveTMDBTests --skip LiveCraftSourcesTests --skip LiveShotOnTests --skip LiveAcclaimTests --skip LiveDiagnosisTests 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          echo "::notice::REVIEW tests took $(( $(date +%s) - start )) s: $(grep -E 'Executed [0-9]+ tests' test.log | tail -1)"
          grep -E "^REVIEW\| " test.log | sed -E 's/^REVIEW\| //' | while read -r l; do echo "::notice::REVIEW ${l}"; done
          # The slowest test classes.
          grep -E "^Test Suite '.*' passed at .*\.$" -A1 test.log | grep -oE "Executed [0-9]+ tests?, with [0-9]+ failures? \([0-9]+ unexpected\) in [0-9.]+ \([0-9.]+\) seconds" | head -0
          grep -E "Test Case '-\[ReelCoreTests\.[A-Za-z]+ [A-Za-z0-9_]+\]' passed \([0-9.]+ seconds\)" test.log \
            | sed -E "s/.*\[ReelCoreTests\.([A-Za-z]+) ([A-Za-z0-9_]+)\]' passed \(([0-9.]+) seconds\)/\3 \1.\2/" \
            | sort -rn | head -12 | while read -r l; do echo "::notice::REVIEW slow test ${l}"; done
          exit $code

  mac-measure:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Build (release, timed)
        run: |
          start=$(date +%s)
          swift build -c release --arch arm64 2>&1 | tail -3
          echo "::notice::REVIEW release build took $(( $(date +%s) - start )) s"
      - name: Measure with a synthetic library
        continue-on-error: true
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          REEL_REVIEW: "1"
        run: |
          mkdir -p screens app/Reel.app/Contents/MacOS
          cp "$(swift build -c release --arch arm64 --show-bin-path)/Reel" app/Reel.app/Contents/MacOS/Reel
          printf '<?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>CFBundleIdentifier</key><string>com.howbizzar.reel.review</string><key>CFBundleExecutable</key><string>Reel</string><key>CFBundlePackageType</key><string>APPL</string><key>CFBundleShortVersionString</key><string>review</string></dict></plist>' > app/Reel.app/Contents/Info.plist
          codesign --force --deep -s - app/Reel.app >/dev/null 2>&1 || true
          REEL_RENDER_SCREENS="$PWD/screens" perl -e 'alarm 900; exec @ARGV' "$PWD/app/Reel.app/Contents/MacOS/Reel" &
          pid=$!
          (
            for page in "All Films, 500 films" "Experiment: 500 cards in the grid as now" "Experiment: fixed-size cards in rows of a LazyVStack"; do
              until grep -q "scroll begins: ${page}" screens/progress.txt 2>/dev/null; do kill -0 $pid 2>/dev/null || exit 0; sleep 0.3; done
              sudo sample $pid 6 -mayDie -file "screens/sample-$(echo "$page" | tr -c 'A-Za-z0-9' '-').txt" >/dev/null 2>&1 || true
            done
          ) &
          wait $pid || true
          grep -E "REVIEW|scroll " screens/progress.txt || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: review-measurements
          path: screens/
          if-no-files-found: ignore
          retention-days: 7
