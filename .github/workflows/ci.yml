name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v5
      - name: Trace
        shell: bash
        env:
          REEL_DIAGNOSE: "1"
        run: |
          swift test --filter LiveDiagnosisTests 2>&1 | tee diag.log | tail -5
          grep "^DIAG| " diag.log > diag.txt || true
          cat diag.txt
      - uses: actions/upload-artifact@v4
        with:
          name: diag
          path: diag.txt
